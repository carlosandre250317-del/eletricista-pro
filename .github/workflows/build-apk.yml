name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar arquivos do projeto
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Verificando index.html:"
          test -f index.html

      - name: Preparar arquivos web
        run: |
          rm -rf www
          mkdir -p www
          cp -f index.html www/index.html
          cp -f manifest.json www/manifest.json
          cp -f sw.js www/sw.js
          cp -r css www/css
          cp -r js www/js
          cp -r icons www/icons
          echo "Conteúdo da pasta www:"
          find www -maxdepth 2 -type f
          test -f www/index.html

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: eletricista-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
